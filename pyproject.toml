[project]
name = "macronutrients-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EmadSoheili", email = "emad.soheili@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "docling>=2.149.0",
    "fastapi>=0.162.2",
    "langchain>=1.4.9",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
macronutrients-project = "macronutrients_project:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
